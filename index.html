<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekday Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.6em;
        }

        .year-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .year-selector button {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .year-selector button:hover {
            background: #5568d3;
        }

        .year-selector span {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            min-width: 60px;
            text-align: center;
        }

        .date-display {
            text-align: center;
            font-size: 1.4em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            padding: 10px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .weekday-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 6px;
            margin-bottom: 10px;
        }

        .weekday-buttons button {
            padding: 10px 8px;
            font-size: 0.9em;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .weekday-buttons button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .weekday-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .weekday-buttons button.selected {
            background: #667eea;
            color: white;
        }

        .feedback {
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            min-height: 36px;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .score {
            text-align: center;
            font-size: 1em;
            color: #666;
        }

        .next-button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .next-button:hover {
            background: #218838;
        }

        .next-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .mode-toggle {
            text-align: center;
            margin-bottom: 10px;
        }

        .voice-mode-button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .voice-mode-button:hover {
            background: #5d3a7f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        .voice-mode-button.active {
            background: #28a745;
        }

        .voice-mode-button.active:hover {
            background: #218838;
        }

        .listening-indicator {
            text-align: center;
            font-size: 0.95em;
            color: #764ba2;
            margin-bottom: 8px;
            min-height: 24px;
            font-weight: 600;
        }

        .listening-indicator.active {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .history-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-left: 8px;
        }

        .history-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
            font-size: 1.5em;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .close-button, .clear-button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .close-button {
            background: #6c757d;
            color: white;
        }

        .close-button:hover {
            background: #5a6268;
        }

        .clear-button {
            background: #dc3545;
            color: white;
        }

        .clear-button:hover {
            background: #c82333;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .history-table th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }

        .history-table td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .history-table tr:hover {
            background: #f7f7f7;
        }

        .empty-history {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Weekday Game</h1>

        <div class="year-selector">
            <button id="prevYear">←</button>
            <span id="yearDisplay">2025</span>
            <button id="nextYear">→</button>
        </div>

        <div class="mode-toggle">
            <button id="voiceModeButton" class="voice-mode-button">
                🎤 Enable Voice Mode
            </button>
            <button id="historyButton" class="history-button">
                📊 History
            </button>
        </div>

        <div id="listeningIndicator" class="listening-indicator"></div>

        <div class="date-display" id="dateDisplay">
            01 / 01 / 2025
        </div>

        <div class="weekday-buttons" id="weekdayButtons">
            <button data-day="1">Monday</button>
            <button data-day="2">Tuesday</button>
            <button data-day="3">Wednesday</button>
            <button data-day="4">Thursday</button>
            <button data-day="5">Friday</button>
            <button data-day="6">Saturday</button>
            <button data-day="0">Sunday</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="score">
            <span id="scoreDisplay">Score: 0 / 0</span>
        </div>

        <button class="next-button" id="nextButton" style="display: none;">Next Round</button>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Failure History</h2>
            </div>
            <div class="modal-actions">
                <button id="closeModal" class="close-button">Close</button>
                <button id="clearHistory" class="clear-button">Clear History</button>
            </div>
            <div id="historyTableContainer"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
